packages:
  - apps/*
  - packages/*

# Native modules and bundlers that need their install scripts to run.
allowBuilds:
  argon2: true
  better-sqlite3: true
  esbuild: true

minimumReleaseAgeExclude:
  - globals@17.14.0
  - '@hookform/resolvers@7.0.1'
  - '@tanstack/query-core@5.105.1'
  - '@tanstack/react-query@5.105.1'
